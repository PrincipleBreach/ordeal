title: PowerShell Encoded Command
id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
status: test
description: >
  Detects PowerShell invoked with an encoded command, frequently used to hide
  payloads from casual inspection and logging.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Principle Breach
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: '-EncodedCommand'
  condition: selection
falsepositives:
  - Rare legitimate automation
level: high
